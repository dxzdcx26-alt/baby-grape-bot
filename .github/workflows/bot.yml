name: Baby Grape Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: baby-grape-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout bot script
        uses: actions/checkout@v4
        with:
          repository: marshmayris/baby-grape-bot
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Write .env
        run: |
          cat > .env <<'EOF'
          token=${{ secrets.TOKEN }}
          guildId=${{ secrets.GUILD_ID }}
          clientId=${{ secrets.CLIENT_ID }}
          controlChannelId=${{ secrets.CONTROL_CHANNEL_ID }}
          logChannelId=${{ secrets.LOG_CHANNEL_ID }}
          scoreChannelId=${{ secrets.SCORE_CHANNEL_ID }}
          mentionRoleId=${{ secrets.MENTION_ROLE_ID }}
          targetChannelId=${{ secrets.TARGET_CHANNEL_ID }}
          archiveCategoryId=${{ secrets.ARCHIVE_CATEGORY_ID }}
          adminRoleId=${{ secrets.ADMIN_ROLE_ID }}
          googleSheetUrl=${{ secrets.GOOGLE_SHEET_URL }}
          EOF

      - name: Deploy slash commands
        run: node deploy-commands.js

      - name: Run bot
        run: node index.js
