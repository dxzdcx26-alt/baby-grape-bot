name: Baby Grape Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: baby-grape-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout bot script
        uses: actions/checkout@v4
        with:
          repository: dxzdcx26-alt/baby-grape-bot
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Write .env
        run: |
          cat > .env <<'EOF'
          token=${{ secrets.TOKEN }}
          clientId=${{ secrets.CLIENT_ID }}
          EOF

      - name: Deploy slash commands
        run: node deploy-commands.js

      - name: Run bot
        run: node index.js
