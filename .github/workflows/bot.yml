name: Baby Grape Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: baby-grape-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout bot script
        uses: actions/checkout@v4
        with:
          repository: dxzdcx26-alt/baby-grape-bot
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Write .env
        run: |
          cat > .env <<'EOF'
          token=${{ secrets.TOKEN }}
          guildId=1572313951121711296
          clientId=1572296382813835284
          controlChannelId=1572317026037276954
          logChannelId=1572317027794686143
          scoreChannelId=1572317029451567144
          mentionRoleId=1572313951121711296
          targetChannelId=1572317031758569513
          archiveCategoryId=1572317023906824325
          adminRoleId=1572316564387008585
          googleSheetUrl=${{ secrets.GOOGLE_SHEET_URL }}
          EOF

      - name: Deploy slash commands
        run: node deploy-commands.js

      - name: Run bot
        run: node index.js
